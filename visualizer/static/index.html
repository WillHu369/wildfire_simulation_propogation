<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wildfire Viewer</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="importmap">
    {"imports": {"three": "/static/vendor/three.module.min.js", "three/addons/": "/static/vendor/"}}
  </script>
</head>
<body>
  <header id="header">
    <div class="brand">
      <div><span class="title">WILDFIRE</span><span class="lab">/ PROPAGATION LAB</span></div>
      <div id="scenario" class="subtitle"></div>
    </div>
    <div class="controls">
      <label>RUN <select id="run"></select></label>
      <label>HEIGHT <input id="exaggeration" type="range" min="0.5" max="5" step="0.5" value="1">
        <span id="exaggeration-value"></span></label>
      <button id="reset-view">Reset view</button>
    </div>
    <div class="sim-time">
      <div class="label">SIMULATION TIME</div>
      <div id="clock">T + 00:00</div>
    </div>
  </header>

  <canvas id="view"></canvas>

  <aside id="stats" class="card">
    <div class="label">FIRE ACTIVITY</div>
    <div id="burning" class="big">0</div>
    <div class="caption">ACTIVELY BURNING CELLS</div>
    <div id="reached" class="medium">0 / 0</div>
    <div class="caption">CELLS REACHED BY FIRE</div>
    <hr>
    <div class="label">FIRELINE INTENSITY</div>
    <div id="intensity-unit" class="unit">kW / m</div>
    <div class="scale">
      <div id="ramp" class="ramp"></div>
      <div class="ticks">
        <div><b id="high-label">VERY HIGH</b><span id="intensity-max"></span></div>
        <div><b id="low-label">LOW</b><span id="intensity-min">0</span></div>
      </div>
    </div>
    <hr>
    <div class="wind-title">Wind field</div>
    <div id="wind-info" class="note">Sparse regional vectors</div>
  </aside>

  <aside id="landcover" class="card">
    <div class="label">LAND COVER</div>
    <div id="legend"></div>
  </aside>

  <footer id="timeline">
    <div class="track-row">
      <button id="play">Play</button>
      <input id="time" type="range" min="0" max="1" step="1" value="0">
      <select id="speed">
        <option value="60">60×</option>
        <option value="300" selected>300×</option>
        <option value="900">900×</option>
        <option value="3600">3600×</option>
      </select>
    </div>
    <div class="labels">
      <span>00:00</span>
      <span id="footer-info"></span>
      <span id="end-time"></span>
    </div>
  </footer>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
